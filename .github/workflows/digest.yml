name: World Digest

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours, UTC
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

permissions:
  contents: write             # needed to commit seen.json back

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests pyyaml

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Persist dedup state
        run: |
          git config user.name "digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "update seen items"
          git push
